[package]
name = "mutarust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mutation testing for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/quality-gates/mutarust"
keywords = ["mutation-testing", "testing", "rust"]
categories = ["development-tools::testing", "command-line-utilities"]

[dependencies]
cargo_metadata = "0.20.0"
libc = "0.2.183"
md5 = "0.7.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
regex = "1.12.3"
rustc_lexer = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "2.0.119", features = ["full", "visit"] }
toml = "0.8.23"
yaml_serde = "0.10.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

[[bin]]
name = "mutarust"
path = "src/main.rs"
