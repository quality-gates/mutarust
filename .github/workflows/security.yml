name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect audit paths
    runs-on: ubuntu-latest
    outputs:
      run_audit_or_unknown: ${{ steps.classes.outputs.run_audit_or_unknown }}
    steps:
      - if: github.event_name != 'schedule'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - if: github.event_name != 'schedule'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            dependencies:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/security.yml'
            light:
              - 'AGENTS.md'
              - 'CONTEXT.md'
              - 'CONTEXT-MAP.md'
              - 'CHANGELOG.md'
              - 'CODE_OF_CONDUCT.md'
              - 'CONTRIBUTING.md'
              - 'LICENSE'
              - 'LICENSE.*'
              - 'README.md'
              - 'docs/**'
              - 'mkdocs.yml'
              - '.agents/**'
              - '.claude/**'
              - '**/*.md'
              - '.gitignore'
              - '.gitattributes'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/PULL_REQUEST_TEMPLATE*'
              - '.github/dependabot.yml'
      - id: classes
        name: Derive audit flag
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            run_audit_or_unknown=true
          else
            dependencies='${{ steps.filter.outputs.dependencies }}'
            light='${{ steps.filter.outputs.light }}'
            force_full="${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') }}"
            if [[ "$force_full" == "true" || "$dependencies" == "true" || "$light" != "true" ]]; then
              run_audit_or_unknown=true
            else
              run_audit_or_unknown=false
            fi
          fi
          echo "run_audit_or_unknown=$run_audit_or_unknown" >> "$GITHUB_OUTPUT"
          echo "Audit paths: event=${{ github.event_name }} force_full=${force_full:-false} run_audit_or_unknown=$run_audit_or_unknown"

  audit:
    needs: changes
    if: needs.changes.outputs.run_audit_or_unknown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

  audit-gate:
    name: audit-gate
    if: always()
    needs: [changes, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require audit result
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path detection failed."
            exit 1
          fi
          if [[ "${{ needs.audit.result }}" != "success" && "${{ needs.audit.result }}" != "skipped" ]]; then
            echo "Audit result: ${{ needs.audit.result }}"
            exit 1
          fi
