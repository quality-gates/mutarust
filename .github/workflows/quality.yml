name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Selective CI path classes (parent #83 / child #84):
# - rust: sources, tests, manifests, lockfile, toolchain config, this workflow
# - light: agent/docs/changelog/markdown and similar non-code paths
# run_rust_or_unknown is true when rust matches OR the diff is not pure-light
# (prefer run over skip).
# package is true when the published README changes; run_package also runs for rust or
# non-light diffs (prefer run over skip).
# Dual-toolchain test jobs are skipped on light diffs. quality-gate accepts skipped
# jobs and fails when a required quality job fails, so required checks do not wedge.

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect path classes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classes.outputs.rust }}
      light: ${{ steps.classes.outputs.light }}
      run_rust_or_unknown: ${{ steps.classes.outputs.run_rust_or_unknown }}
      package: ${{ steps.classes.outputs.package }}
      run_package: ${{ steps.classes.outputs.run_package }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.cargo/**'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.github/workflows/quality.yml'
            light:
              - 'AGENTS.md'
              - 'CONTEXT.md'
              - 'CONTEXT-MAP.md'
              - 'CHANGELOG.md'
              - 'CODE_OF_CONDUCT.md'
              - 'CONTRIBUTING.md'
              - 'LICENSE'
              - 'LICENSE.*'
              - 'README.md'
              - 'docs/**'
              - 'mkdocs.yml'
              - '.agents/**'
              - '.claude/**'
              - '**/*.md'
              - '.gitignore'
              - '.gitattributes'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/PULL_REQUEST_TEMPLATE*'
              - '.github/dependabot.yml'
            package:
              - 'README.md'
      - id: classes
        name: Derive job flags
        run: |
          rust='${{ steps.filter.outputs.rust }}'
          light='${{ steps.filter.outputs.light }}'
          package='${{ steps.filter.outputs.package }}'
          force_full="${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') }}"
          if [[ "$force_full" == "true" || "$rust" == "true" || "$light" != "true" ]]; then
            run_rust_or_unknown=true
          else
            run_rust_or_unknown=false
          fi
          if [[ "$run_rust_or_unknown" == "true" || "$package" == "true" ]]; then
            run_package=true
          else
            run_package=false
          fi
          {
            echo "rust=$rust"
            echo "light=$light"
            echo "run_rust_or_unknown=$run_rust_or_unknown"
            echo "package=$package"
            echo "run_package=$run_package"
          } >> "$GITHUB_OUTPUT"
          echo "Path classes: rust=$rust light=$light package=$package force_full=$force_full run_rust_or_unknown=$run_rust_or_unknown run_package=$run_package"

  lint:
    needs: changes
    if: needs.changes.outputs.run_rust_or_unknown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.run_rust_or_unknown == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.85", stable]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-targets --all-features --locked

  build:
    needs: changes
    if: needs.changes.outputs.run_rust_or_unknown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - run: cargo build --release --locked

  docs:
    needs: changes
    if: needs.changes.outputs.run_rust_or_unknown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - run: cargo doc --workspace --all-features --no-deps --locked

  package:
    needs: changes
    if: needs.changes.outputs.run_package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - run: cargo package --locked
      - name: Install package artifact
        run: |
          package_root="$RUNNER_TEMP/mutarust-package"
          install_root="$RUNNER_TEMP/mutarust-install"
          mkdir -p "$package_root"
          package_artifact="$(find target/package -maxdepth 1 -name 'mutarust-*.crate' -print -quit)"
          test -n "$package_artifact"
          tar -xzf "$package_artifact" -C "$package_root" --strip-components=1
          cargo install --path "$package_root" --root "$install_root" --locked
          "$install_root/bin/mutarust" --help
          "$install_root/bin/mutarust" --version

  quality-gate:
    name: quality-gate
    if: always()
    needs: [changes, lint, test, build, docs, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality jobs
        run: |
          fail=0
          check() {
            local name="$1"
            local result="$2"
            echo "$name=$result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$name ended with $result"
                fail=1
                ;;
            esac
          }
          check changes "${{ needs.changes.result }}"
          check lint "${{ needs.lint.result }}"
          check test "${{ needs.test.result }}"
          check build "${{ needs.build.result }}"
          check docs "${{ needs.docs.result }}"
          check package "${{ needs.package.result }}"
          exit "$fail"
