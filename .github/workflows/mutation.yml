name: Mutation Testing

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/mutation.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect mutation inputs
    runs-on: ubuntu-latest
    outputs:
      run_mutation: ${{ steps.classes.outputs.run_mutation }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mutation:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/mutation.yml'
      - id: classes
        name: Derive mutation flag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            run_mutation=true
          else
            mutation='${{ steps.filter.outputs.mutation }}'
            force_full="${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}"
            if [[ "$force_full" == "true" || "$mutation" == "true" ]]; then
              run_mutation=true
            else
              run_mutation=false
            fi
          fi
          echo "run_mutation=$run_mutation" >> "$GITHUB_OUTPUT"
          echo "Mutation inputs: event=${{ github.event_name }} force_full=${force_full:-false} run_mutation=$run_mutation"

  mutation:
    needs: changes
    if: needs.changes.outputs.run_mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.0
        with:
          # --git-diff-lines needs the base branch and merge-base history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Build release mutarust
        run: cargo build --release --locked
      - name: Run mutation testing
        # Approved production scope: modules with isolated lib unit tests.
        # Excluded (written technical reasons):
        #   src/main.rs — CLI entry; the acceptance suite packages and reinstalls
        #     the command, so a per-mutant acceptance run is recursive and slow.
        #   src/execution.rs — primarily covered by that package acceptance suite;
        #     lib unit tests cover score and display helpers only.
        #   Built-in mutator modules and discovery/git/configuration/filter/
        #     coverage/baseline/blacklist, plus remaining report helpers — covered
        #     by fixture acceptance tests rather than lib unit tests. Per-mutant
        #     acceptance would package and reinstall for each mutant.
        # --test-flags "--lib" keeps each mutant on the lib unit suite. The
        # package acceptance suite is not a safe per-mutant exec command.
        # Pull requests mutate only changed lines inside this approved scope.
        # Pushes to main retain the full approved scope so a faulty diff filter
        # cannot hide a regression permanently.
        # --coverage marks uncovered mutants and enables the covered-code gate.
        # --min-msi and --min-covered-msi enforce the parity quality gates.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          scope_args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            scope_args=(
              --git-diff-lines
              --git-diff-base origin/main
              --ignore-msi-with-no-mutations
            )
          fi

          ./target/release/mutarust \
            --coverage \
            --test-flags "--lib" \
            --exec-timeout 180 \
            --workers 8 \
            "${scope_args[@]}" \
            --min-msi 75 \
            --min-covered-msi 80 \
            src/report/github.rs \
            src/report/gitlab.rs \
            src/evidence.rs \
            src/progress.rs
