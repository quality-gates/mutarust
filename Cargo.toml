[package]
name = "mutarust"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Mutation testing for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/quality-gates/mutarust"
homepage = "https://github.com/quality-gates/mutarust"
documentation = "https://quality-gates.github.io/mutarust/"
keywords = ["mutation-testing", "testing", "rust"]
categories = ["development-tools::testing", "command-line-utilities"]
exclude = [
    ".agents/",
    ".serena/",
    "skills-lock.json",
    "githooks/",
    "docs/agents/",
    "AGENTS.md",
    "CLAUDE.md",
]

[dependencies]
cargo_metadata = "0.20.0"
libc = "0.2.183"
md5 = "0.8.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
regex = "1.12.3"
rustc_lexer = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.0"
syn = { version = "3.0.3", features = ["full", "visit", "extra-traits"] }
toml = "1.1.4"
yaml_serde = "0.10.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
jsonschema = { version = "0.49.3", default-features = false }

[[bin]]
name = "mutarust"
path = "src/main.rs"
